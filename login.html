<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearshare 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .tab { height: 44px; border: 0; border-radius: 9px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: transparent; color: #5A6475; }
  .tab[aria-selected="true"] { background: #FFFFFF; color: #0B2A5B; box-shadow: 0 1px 3px rgba(11,42,91,0.15); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; font-weight: 600; }
  .field input { height: 48px; padding: 0 14px; border: 1px solid #C7D0DD; border-radius: 10px; font: inherit; font-size: 15px; min-width: 0; }
  .ghost { height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #1D4E9E; background: #FFFFFF; color: #1D4E9E; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .primary { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: #0B2A5B; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none; }
  .primary:hover { color: #FFFFFF; background: #133A78; }
  .note { font-size: 12px; line-height: 1.6; color: #5A6475; text-align: center; }
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column">

<header style="background: #FFFFFF; border-bottom: 1px solid #DDE2EA">
  <div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
    <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0B2A5B">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="9" r="5" fill="#0B2A5B"></circle><circle cx="24" cy="9" r="5" fill="#0B2A5B"></circle><circle cx="16" cy="18" r="12" fill="#0B2A5B"></circle><circle cx="12" cy="17" r="1.6" fill="#FFFFFF"></circle><circle cx="20" cy="17" r="1.6" fill="#FFFFFF"></circle><ellipse cx="16" cy="22.5" rx="4.5" ry="3.2" fill="#F2B23A"></ellipse></svg>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Bearshare</span>
    </a>
    <nav aria-label="주메뉴" style="display: flex; gap: 4px; flex-wrap: wrap; align-items: center">
      <a href="index.html" style="padding: 10px 14px; font-weight: 600; color: #1A2233; text-decoration: none; border-radius: 8px">홈</a>
      <a href="spaces.html" style="padding: 10px 14px; font-weight: 600; color: #1A2233; text-decoration: none; border-radius: 8px">공간안내</a>
      <a href="guide.html" style="padding: 10px 14px; font-weight: 600; color: #1A2233; text-decoration: none; border-radius: 8px">대관안내</a>
      <a href="reserve.html" style="padding: 10px 14px; font-weight: 600; color: #1A2233; text-decoration: none; border-radius: 8px">대관신청</a>
      <a href="classes.html" style="padding: 10px 14px; font-weight: 600; color: #1A2233; text-decoration: none; border-radius: 8px">수업 둘러보기</a>
    </nav>
  </div>
</header>

<main style="flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 64px 16px">
  <div style="width: 100%; max-width: 440px; background: #FFFFFF; border: 1px solid #DDE2EA; border-radius: 20px; padding: 36px 32px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
      <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="9" r="5" fill="#0B2A5B"></circle><circle cx="24" cy="9" r="5" fill="#0B2A5B"></circle><circle cx="16" cy="18" r="12" fill="#0B2A5B"></circle><circle cx="12" cy="17" r="1.6" fill="#FFFFFF"></circle><circle cx="20" cy="17" r="1.6" fill="#FFFFFF"></circle><ellipse cx="16" cy="22.5" rx="4.5" ry="3.2" fill="#F2B23A"></ellipse></svg>
      <h1 style="margin: 0; font-size: 26px">Bearshare 로그인</h1>
      <span style="font-size: 14px; color: #5A6475">주민과 재학생 모두 로그인 후 예약할 수 있어요.</span>
    </div>

    <div role="tablist" aria-label="회원 구분" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #F1F3F7; border-radius: 12px; padding: 4px">
      <button type="button" role="tab" class="tab" id="tab-res" aria-selected="true" aria-controls="panel-res">지역주민</button>
      <button type="button" role="tab" class="tab" id="tab-stu" aria-selected="false" aria-controls="panel-stu">재학생</button>
    </div>

    <form id="panel-res" role="tabpanel" aria-labelledby="tab-res" style="display: flex; flex-direction: column; gap: 14px">
      <div class="field"><label for="lname">이름</label><input id="lname" type="text" placeholder="홍길동"></div>
      <div class="field">
        <label for="lphone">휴대폰 번호</label>
        <div style="display: flex; gap: 8px"><input id="lphone" type="tel" placeholder="010-0000-0000" style="flex: 1"><button type="button" class="ghost">인증번호 받기</button></div>
      </div>
      <div class="field"><label for="lcode">인증번호</label><input id="lcode" type="text" inputmode="numeric" placeholder="6자리 숫자"></div>
      <a href="mypage.html" class="primary">로그인</a>
      <span class="note">처음이면 인증 후 자동으로 가입돼요. 이름·연락처는 예약 안내에만 사용합니다.</span>
    </form>

    <form id="panel-stu" role="tabpanel" aria-labelledby="tab-stu" hidden style="flex-direction: column; gap: 14px">
      <div class="field"><label for="lsid">학번</label><input id="lsid" type="text" inputmode="numeric" placeholder="32xxxxxx"></div>
      <div class="field">
        <label for="lmail">학교 이메일</label>
        <div style="display: flex; gap: 8px"><input id="lmail" type="email" placeholder="학번@dankook.ac.kr" style="flex: 1"><button type="button" class="ghost">인증 메일</button></div>
      </div>
      <div class="field"><label for="lscode">인증번호</label><input id="lscode" type="text" inputmode="numeric" placeholder="메일로 받은 6자리"></div>
      <a href="mypage.html" class="primary">학번 인증하고 로그인</a>
      <span class="note">재학생 인증은 학교 이메일로 한 번만 하면 돼요.</span>
    </form>

    <div style="border-top: 1px solid #EEF1F5; padding-top: 16px; display: flex; justify-content: center; gap: 16px; font-size: 14px">
      <a href="mypage.html">비회원 예약 조회</a>
      <a href="guide.html">이용 기준</a>
    </div>
  </div>
</main>

<footer style="background: #0B2A5B; color: #C9D4E8">
  <div style="max-width: 1200px; margin: 0 auto; padding: 24px; font-size: 13px">Bearshare · 단국대학교 천안캠퍼스 유휴 공간 공유 시범 서비스</div>
</footer>
</div>
<script>
  // 지역주민 / 재학생 탭 전환
  const tabs = { res: document.getElementById('tab-res'), stu: document.getElementById('tab-stu') };
  const panels = { res: document.getElementById('panel-res'), stu: document.getElementById('panel-stu') };
  function show(key) {
    Object.keys(tabs).forEach((k) => {
      const on = k === key;
      tabs[k].setAttribute('aria-selected', on ? 'true' : 'false');
      panels[k].hidden = !on;
      panels[k].style.display = on ? 'flex' : 'none';
    });
  }
  tabs.res.addEventListener('click', () => show('res'));
  tabs.stu.addEventListener('click', () => show('stu'));
</script>
</body>
</html>
